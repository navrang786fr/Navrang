<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Navarang — Order</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0A2A12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="navrang_logo.png">
<link rel="apple-touch-icon" href="navrang_logo.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Yatra+One&family=Aref+Ruqaa:wght@400;700&family=Karla:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap');

  /* Default palette — sampled directly from navrang_logo.png (deep emblem green + halal gold) */
  :root{
    --paper:#F7F1DE; --paper-soft:#EDE3C2; --ink:#16231A;
    --maroon:#12401C; --maroon-deep:#0A2A12;
    --turmeric:#B3821E; --turmeric-light:#E7CB86;
    --leaf:#4C7A1E; --nonveg:#A83A28; --rule:rgba(22,35,26,.16);
  }
  html[data-theme="classic"]{
    --paper:#F9EFD8; --paper-soft:#F2E6C6; --ink:#2A2016;
    --maroon:#7A1220; --maroon-deep:#5A0D18;
    --turmeric:#D89A1B; --turmeric-light:#F3D98A;
    --leaf:#3F5D3A; --nonveg:#7A1220; --rule:rgba(42,32,22,.16);
  }
  html[data-theme="emerald"]{
    --paper:#F7F1DE; --paper-soft:#EDE3C2; --ink:#16231A;
    --maroon:#12401C; --maroon-deep:#0A2A12;
    --turmeric:#B3821E; --turmeric-light:#E7CB86;
    --leaf:#4C7A1E; --nonveg:#A83A28; --rule:rgba(22,35,26,.16);
  }
  html[data-theme="royal"]{
    --paper:#F3EFE3; --paper-soft:#E7E1CE; --ink:#1B1A2E;
    --maroon:#2A2470; --maroon-deep:#191552;
    --turmeric:#D4AF37; --turmeric-light:#EAD98A;
    --leaf:#3A6B5C; --nonveg:#8B2635; --rule:rgba(27,26,46,.16);
  }
  html[data-theme="charcoal"]{
    --paper:#EDE7DA; --paper-soft:#E1D9C8; --ink:#211C18;
    --maroon:#3A2E28; --maroon-deep:#1E1714;
    --turmeric:#B5651D; --turmeric-light:#E3A868;
    --leaf:#4B5D3A; --nonveg:#8B3A2E; --rule:rgba(33,28,24,.16);
  }

  :root{
    --shadow-xs:0 1px 2px rgba(30,18,10,.06);
    --shadow-sm:0 2px 8px rgba(30,18,10,.10);
    --shadow-md:0 6px 20px rgba(30,18,10,.14);
    --shadow-lg:0 18px 44px rgba(30,18,10,.22);
    --ease:cubic-bezier(.32,.72,0,1);
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--paper-soft);
    font-family:'Karla',sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;}
  input,textarea{font-family:inherit;}

  .app-shell{
    max-width:560px;margin:0 auto;min-height:100vh;
    background:var(--paper);position:relative;
    box-shadow:var(--shadow-lg);
    display:flex;flex-direction:column;
  }
  .app-shell::before{
    content:'';display:block;flex:0 0 auto;height:4px;
    background:linear-gradient(90deg,var(--turmeric) 0%,var(--turmeric-light) 50%,var(--turmeric) 100%);
  }

  /* ---------- Top bar ---------- */
  .topbar{
    position:sticky;top:0;z-index:40;
    background:linear-gradient(165deg,var(--maroon) 0%, var(--maroon-deep) 100%);
    color:var(--paper);
    padding:12px 14px;padding-top:max(12px, env(safe-area-inset-top));
    display:flex;align-items:center;justify-content:space-between;
    box-shadow:var(--shadow-sm);
  }
  .topbar .brand-wrap{display:flex;align-items:center;}
  .brand-mark{
    width:32px;height:32px;border-radius:50%;flex:0 0 auto;margin-right:9px;
    background:#fff;border:1.4px solid var(--turmeric);
    box-shadow:0 0 0 3px rgba(243,217,138,.14);
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  .brand-mark img{width:100%;height:100%;object-fit:cover;display:block;}
  .topbar .brand{font-family:'Yatra One',cursive;font-size:22px;color:#F7E7B4;letter-spacing:.5px;}
  .topbar .brand-ar{font-family:'Aref Ruqaa',serif;font-weight:700;font-size:14px;direction:rtl;color:var(--turmeric);margin-left:8px;}
  .topbar-actions{display:flex;align-items:center;gap:8px;}
  .icon-btn{
    width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.25);
    background:rgba(255,255,255,.08);color:var(--paper);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    text-decoration:none;
    transition:transform .15s ease,background .15s ease;
  }
  .icon-btn svg{width:17px;height:17px;}
  .icon-btn:active{transform:scale(.92);background:rgba(255,255,255,.16);}

  .theme-picker{display:flex;gap:7px;align-items:center;}
  .theme-swatch{
    width:17px;height:17px;border-radius:50%;padding:0;cursor:pointer;
    border:2px solid rgba(255,255,255,.3);
    background:linear-gradient(135deg,var(--sw1) 50%,var(--sw2) 50%);
    transition:transform .15s ease;
  }
  .theme-swatch:active{transform:scale(.88);}
  .theme-swatch.active{border-color:var(--turmeric-light);box-shadow:0 0 0 2px var(--maroon-deep),0 0 0 3px var(--turmeric-light);}

  /* ---------- Hero strip ---------- */
  .hero-strip{
    background:
      radial-gradient(ellipse at 50% 0%, rgba(216,154,27,.10) 0%, rgba(216,154,27,0) 60%),
      var(--paper-soft);
    padding:18px 16px 14px;text-align:center;
    border-bottom:1px solid var(--rule);
    position:relative;
  }
  .hero-logo{
    width:76px;height:76px;border-radius:50%;background:#fff;
    border:2px solid var(--turmeric);object-fit:cover;display:block;margin:0 auto 10px;
    box-shadow:var(--shadow-md),0 0 0 4px rgba(243,217,138,.14);
  }
  .hero-strip .ar{font-family:'Aref Ruqaa',serif;font-weight:700;font-size:21px;direction:rtl;color:var(--maroon-deep);margin-bottom:1px;}
  .hero-divider{display:flex;align-items:center;justify-content:center;gap:7px;margin:8px 0 9px;}
  .hero-divider span{width:38px;height:1px;background:linear-gradient(90deg,transparent,var(--turmeric));}
  .hero-divider span:last-child{background:linear-gradient(90deg,var(--turmeric),transparent);}
  .hero-divider i{width:5px;height:5px;background:var(--turmeric);transform:rotate(45deg);display:inline-block;flex:0 0 auto;}
  .hero-strip .tag{font-size:11.5px;letter-spacing:2px;text-transform:uppercase;color:var(--maroon);font-weight:700;opacity:.85;}

  /* ---------- Search + filter bar ---------- */
  .search-bar{
    position:sticky;top:58px;z-index:35;
    background:var(--paper);padding:10px 14px;
    border-bottom:1px solid var(--rule);
    display:flex;gap:8px;align-items:center;
  }
  .search-field{
    flex:1;display:flex;align-items:center;gap:8px;
    background:var(--paper-soft);border:1px solid var(--rule);
    border-radius:11px;padding:9px 12px;
    transition:border-color .15s ease,box-shadow .15s ease;
  }
  .search-field:focus-within{border-color:var(--maroon);box-shadow:0 0 0 3px rgba(122,18,32,.08);}
  .search-field svg{width:16px;height:16px;color:var(--maroon);flex:0 0 auto;}
  .search-field input{
    border:none;background:transparent;outline:none;
    font-size:14.5px;color:var(--ink);width:100%;
  }
  .search-field input::placeholder{color:rgba(42,32,22,.45);}
  .veg-toggle{
    flex:0 0 auto;display:flex;align-items:center;gap:6px;
    border:1.4px solid var(--leaf);color:var(--leaf);
    border-radius:11px;padding:8px 11px;font-size:12px;font-weight:700;
    background:var(--paper);cursor:pointer;white-space:nowrap;
    transition:background .15s ease,color .15s ease,transform .15s ease;
  }
  .veg-toggle:active{transform:scale(.95);}
  .veg-toggle .sq{width:11px;height:11px;border:1.4px solid currentColor;display:inline-flex;align-items:center;justify-content:center;}
  .veg-toggle .sq::after{content:'';width:5px;height:5px;border-radius:50%;background:currentColor;}
  .veg-toggle.active{background:var(--leaf);color:#fff;box-shadow:var(--shadow-xs);}

  /* ---------- Category chips ---------- */
  .chip-row{
    position:sticky;top:112px;z-index:30;
    background:var(--paper);border-bottom:1px solid var(--rule);
    display:flex;gap:8px;overflow-x:auto;padding:9px 14px;
    scrollbar-width:none;
  }
  .chip-row::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;display:flex;align-items:center;gap:6px;
    padding:7px 13px;border-radius:20px;
    background:var(--paper-soft);border:1px solid var(--rule);
    font-size:12.5px;font-weight:700;color:var(--ink);
    cursor:pointer;white-space:nowrap;
    transition:background .15s ease,color .15s ease,box-shadow .15s ease,border-color .15s ease;
  }
  .chip:active{transform:scale(.96);}
  .chip svg{width:13px;height:13px;flex:0 0 auto;}
  .chip.active{background:linear-gradient(135deg,var(--maroon),var(--maroon-deep));border-color:var(--maroon-deep);color:var(--turmeric-light);box-shadow:var(--shadow-sm);}

  /* ---------- Menu content ---------- */
  .menu-content{flex:1;padding:6px 14px 16px;}
  .menu-section{scroll-margin-top:172px;padding-top:18px;}
  .section-head{
    display:flex;align-items:center;gap:10px;
    color:var(--maroon-deep);font-weight:700;font-size:13.5px;
    text-transform:uppercase;letter-spacing:1.1px;
    padding-bottom:9px;margin-bottom:10px;
    position:relative;border-bottom:1px solid var(--rule);
  }
  .section-head::after{
    content:'';position:absolute;left:0;bottom:-1px;height:2px;width:46px;
    background:linear-gradient(90deg,var(--turmeric),transparent);
  }
  .section-head .cat-icon{
    display:flex;align-items:center;justify-content:center;flex:0 0 auto;
    width:32px;height:32px;border-radius:50%;
    background:linear-gradient(135deg,var(--maroon),var(--maroon-deep));
    color:var(--turmeric-light);box-shadow:var(--shadow-xs);
  }
  .section-head .cat-icon svg{width:16px;height:16px;display:block;}
  .section-head .n{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;text-transform:none;letter-spacing:0;color:var(--maroon);background:var(--paper-soft);border:1px solid var(--rule);padding:3px 8px;border-radius:20px;opacity:.85;}

  .dish{
    display:flex;align-items:center;gap:11px;
    padding:12px 13px;margin-bottom:8px;
    background:var(--paper);border:1px solid var(--rule);border-radius:13px;
    box-shadow:var(--shadow-xs);
    transition:box-shadow .15s ease,transform .15s ease,border-color .15s ease;
  }
  .dish:active{transform:scale(.99);}
  .dish .dot{width:11px;height:11px;border:1.4px solid currentColor;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;border-radius:2px;}
  .dish .dot::after{content:'';width:4.5px;height:4.5px;border-radius:50%;background:currentColor;}
  .dish .dot.veg{color:var(--leaf);}
  .dish .dot.nonveg{color:var(--nonveg);}
  .dish-info{flex:1;min-width:0;}
  .dish-name{font-size:14.5px;font-weight:700;line-height:1.3;color:var(--ink);}
  .dish-price{
    flex:0 0 auto;font-family:'IBM Plex Mono',monospace;font-size:13px;
    color:var(--maroon-deep);font-weight:700;
    background:var(--turmeric-light);border:1px solid rgba(216,154,27,.4);
    padding:5px 11px;border-radius:8px;
  }

  .no-price{flex:0 0 auto;color:rgba(42,32,22,.5);font-size:12px;font-style:italic;}

  .empty-state{
    text-align:center;padding:60px 20px;color:rgba(42,32,22,.55);
  }
  .empty-state svg{width:46px;height:46px;color:var(--maroon);opacity:.5;margin-bottom:10px;}
  .empty-state p{margin:0;font-size:14px;}

  .menu-footer{padding:10px 24px 30px;text-align:center;}
  .menu-footer p{margin:10px 0 0;font-size:11.5px;color:rgba(42,32,22,.55);line-height:1.55;font-style:italic;}

  @media (min-width:601px){
    body{
      background:
        radial-gradient(ellipse 60% 40% at 50% 0%, rgba(216,154,27,.12) 0%, rgba(216,154,27,0) 70%),
        linear-gradient(180deg,#DED2AE 0%,#c2b285 100%);
      padding:32px 0;
    }
    .app-shell{border-radius:24px;overflow:hidden;min-height:auto;}
  }
</style>
</head>
<body>

<div class="app-shell">

  <div class="topbar">
    <div class="brand-wrap">
      <span class="brand-mark" aria-hidden="true"><img src="navrang_logo.png" alt=""></span>
      <span class="brand">Navarang</span>
      <span class="brand-ar">نڤارنگ</span>
    </div>
    <div class="topbar-actions">
      <a class="icon-btn" href="https://www.instagram.com/navrang786fr/" target="_blank" rel="noopener" title="Follow us on Instagram" aria-label="Follow us on Instagram">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1112.63 8 4 4 0 0116 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
      </a>
      <button class="icon-btn" id="waiterBtn" title="Call waiter" aria-label="Call waiter">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
      </button>
      <div class="theme-picker" role="group" aria-label="Choose color theme">
        <button class="theme-swatch" data-theme="classic" style="--sw1:#7A1220;--sw2:#D89A1B" title="Classic" aria-label="Classic theme"></button>
        <button class="theme-swatch active" data-theme="emerald" style="--sw1:#1F5C3A;--sw2:#C9A227" title="Emerald" aria-label="Emerald theme"></button>
        <button class="theme-swatch" data-theme="royal" style="--sw1:#2A2470;--sw2:#D4AF37" title="Royal" aria-label="Royal theme"></button>
        <button class="theme-swatch" data-theme="charcoal" style="--sw1:#3A2E28;--sw2:#B5651D" title="Charcoal" aria-label="Charcoal theme"></button>
      </div>
    </div>
  </div>

  <div class="hero-strip">
    <img class="hero-logo" src="navrang_logo.png" alt="Navarang Family Restaurant">
    <div class="ar">نڤارنگ</div>
    <div class="hero-divider" aria-hidden="true"><span></span><i></i><span></span></div>
    <div class="tag">Scan · Browse · Call Waiter</div>
  </div>

  <div class="search-bar">
    <div class="search-field">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="text" id="searchInput" placeholder="Search dishes…" autocomplete="off">
    </div>
    <button class="veg-toggle" id="vegToggle" type="button"><span class="sq"></span>Veg</button>
  </div>

  <div class="chip-row" id="chipRow"></div>

  <div class="menu-content" id="menuContent"></div>

  <div class="menu-footer">
    <div class="hero-divider" aria-hidden="true"><span></span><i></i><span></span></div>
    <p>Ready to order? Tap the bell icon at the top to call your waiter. All prices are inclusive of applicable taxes — please inform your server of any food allergies.</p>
  </div>

</div>

<script src="config.js"></script>
<script src="menu-data.js"></script>
<script src="order-app.js"></script>
</body>
</html>

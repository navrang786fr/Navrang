<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Navrang — Customer Ratings</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A2A12">
<link rel="icon" href="navrang_logo.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Yatra+One&family=Karla:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap');

  :root{
    --paper:#F7F1DE; --paper-soft:#EDE3C2; --ink:#16231A;
    --maroon:#12401C; --maroon-deep:#0A2A12;
    --turmeric:#B3821E; --turmeric-light:#E7CB86;
    --leaf:#4C7A1E; --nonveg:#A83A28; --rule:rgba(22,35,26,.16);
    --shadow-xs:0 1px 2px rgba(30,18,10,.06);
    --shadow-sm:0 2px 8px rgba(30,18,10,.10);
    --shadow-md:0 6px 20px rgba(30,18,10,.14);
    --shadow-lg:0 18px 44px rgba(30,18,10,.22);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;min-height:100%;}
  body{
    background:var(--paper-soft);
    font-family:'Karla',sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  button,input{font-family:inherit;}

  .app-shell{max-width:820px;margin:0 auto;min-height:100vh;background:var(--paper);box-shadow:var(--shadow-lg);}

  .topbar{
    position:sticky;top:0;z-index:20;
    background:linear-gradient(135deg,var(--maroon),var(--maroon-deep));
    color:var(--turmeric-light);padding:16px 18px;
    display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-sm);
  }
  .topbar img{width:38px;height:38px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 0 2px rgba(255,255,255,.25);}
  .topbar h1{font-family:'Yatra One',cursive;font-weight:400;font-size:21px;margin:0;color:#fff;}
  .topbar p{margin:1px 0 0;font-size:11px;letter-spacing:1px;text-transform:uppercase;opacity:.85;}

  .panel{padding:16px 18px;}

  .summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;}
  .summary-card{
    background:var(--paper-soft);border:1px solid var(--rule);border-radius:13px;
    padding:12px 10px;text-align:center;
  }
  .summary-card .val{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:700;color:var(--maroon-deep);}
  .summary-card .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--maroon);font-weight:700;margin-top:3px;opacity:.85;}

  .filter-bar{
    display:flex;flex-wrap:wrap;gap:10px;align-items:end;
    background:var(--paper-soft);border:1px solid var(--rule);border-radius:13px;
    padding:12px;margin-bottom:16px;
  }
  .filter-field{display:flex;flex-direction:column;gap:5px;}
  .filter-field label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--maroon);}
  .filter-field input[type="date"]{
    border:1.3px solid var(--rule);border-radius:9px;padding:8px 10px;
    font-size:13px;color:var(--ink);background:var(--paper);outline:none;
  }
  .filter-field input:focus{border-color:var(--maroon);}
  .preset-row{display:flex;gap:6px;flex-wrap:wrap;}
  .preset-btn{
    border:1.3px solid var(--rule);background:var(--paper);color:var(--ink);
    border-radius:20px;padding:7px 13px;font-size:12px;font-weight:700;cursor:pointer;
    transition:background .15s ease,color .15s ease,border-color .15s ease;
  }
  .preset-btn.active{background:linear-gradient(135deg,var(--maroon),var(--maroon-deep));border-color:var(--maroon-deep);color:var(--turmeric-light);}
  .clear-btn{
    margin-left:auto;border:none;background:none;color:var(--maroon);
    font-size:12px;font-weight:700;cursor:pointer;text-decoration:underline;padding:6px 0;
  }

  .ratings-list{display:flex;flex-direction:column;gap:10px;}
  .rating-card{
    background:var(--paper);border:1px solid var(--rule);border-radius:13px;
    padding:13px 14px;box-shadow:var(--shadow-xs);
  }
  .rating-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px;}
  .rating-name{font-weight:700;font-size:14.5px;color:var(--ink);}
  .rating-date{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--maroon);opacity:.8;white-space:nowrap;}
  .rating-stars{color:var(--turmeric);font-size:15px;letter-spacing:1px;margin-bottom:8px;}
  .rating-stars .off{color:var(--rule);}
  .rating-dishes{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
  .dish-tag{
    background:var(--turmeric-light);color:var(--maroon-deep);border:1px solid rgba(216,154,27,.4);
    border-radius:12px;padding:3px 10px;font-size:11.5px;font-weight:700;
  }
  .rating-comments{font-size:13px;line-height:1.45;color:var(--ink);opacity:.9;font-style:italic;}

  .empty-state{text-align:center;padding:60px 20px;color:rgba(42,32,22,.55);}
  .empty-state svg{width:44px;height:44px;color:var(--maroon);opacity:.5;margin-bottom:10px;}
  .empty-state p{margin:0;font-size:14px;}

  .loading{text-align:center;padding:50px 20px;color:var(--maroon);font-size:13px;}

  @media (max-width:480px){
    .summary-grid{grid-template-columns:repeat(3,1fr);gap:7px;}
    .summary-card{padding:10px 6px;}
    .summary-card .val{font-size:17px;}
    .clear-btn{margin-left:0;}
  }
</style>
</head>
<body>

<div class="app-shell">
  <div class="topbar">
    <img src="navrang_logo.png" alt="Navrang">
    <div>
      <h1>Customer Ratings</h1>
      <p>Navrang Family Restaurant</p>
    </div>
  </div>

  <div class="panel">
    <div class="summary-grid" id="summaryGrid">
      <div class="summary-card"><div class="val" id="statCount">–</div><div class="lbl">Ratings</div></div>
      <div class="summary-card"><div class="val" id="statAvg">–</div><div class="lbl">Avg Stars</div></div>
      <div class="summary-card"><div class="val" id="statTopDish">–</div><div class="lbl">Top Dish</div></div>
    </div>

    <div class="filter-bar">
      <div class="filter-field">
        <label for="fromDate">From</label>
        <input type="date" id="fromDate">
      </div>
      <div class="filter-field">
        <label for="toDate">To</label>
        <input type="date" id="toDate">
      </div>
      <div class="preset-row" id="presetRow">
        <button type="button" class="preset-btn" data-range="today">Today</button>
        <button type="button" class="preset-btn" data-range="7">7 Days</button>
        <button type="button" class="preset-btn" data-range="30">30 Days</button>
        <button type="button" class="preset-btn active" data-range="all">All Time</button>
      </div>
      <button type="button" class="clear-btn" id="clearFilter">Clear</button>
    </div>

    <div id="listWrap">
      <div class="loading" id="loadingMsg">Loading ratings…</div>
    </div>
  </div>
</div>

<script>
(function(){
  var listWrap = document.getElementById('listWrap');
  var fromDate = document.getElementById('fromDate');
  var toDate = document.getElementById('toDate');
  var presetRow = document.getElementById('presetRow');
  var clearFilter = document.getElementById('clearFilter');

  var allRatings = [];

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  function fmtDate(iso){
    var d = new Date(iso);
    if (isNaN(d)) return '';
    return d.toLocaleDateString(undefined, { year:'numeric', month:'short', day:'numeric' }) +
      ' ' + d.toLocaleTimeString(undefined, { hour:'2-digit', minute:'2-digit' });
  }

  function starRow(n){
    var out = '';
    for (var i = 1; i <= 5; i++) out += (i <= n ? '★' : '<span class="off">★</span>');
    return out;
  }

  function dayStart(dateStr){
    var d = new Date(dateStr + 'T00:00:00');
    return d;
  }
  function dayEnd(dateStr){
    var d = new Date(dateStr + 'T23:59:59.999');
    return d;
  }

  function setActivePreset(range){
    Array.prototype.forEach.call(presetRow.querySelectorAll('.preset-btn'), function(b){
      b.classList.toggle('active', b.dataset.range === range);
    });
  }

  function applyPreset(range){
    var now = new Date();
    var to = new Date(now);
    var from;
    if (range === 'today'){
      from = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    } else if (range === '7'){
      from = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 6);
    } else if (range === '30'){
      from = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 29);
    } else {
      fromDate.value = '';
      toDate.value = '';
      setActivePreset('all');
      render();
      return;
    }
    fromDate.value = toISODate(from);
    toDate.value = toISODate(to);
    setActivePreset(range);
    render();
  }

  function toISODate(d){
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }

  function getFiltered(){
    var from = fromDate.value ? dayStart(fromDate.value) : null;
    var to = toDate.value ? dayEnd(toDate.value) : null;
    return allRatings.filter(function(r){
      var t = new Date(r.submittedAt);
      if (isNaN(t)) return false;
      if (from && t < from) return false;
      if (to && t > to) return false;
      return true;
    });
  }

  function renderSummary(rows){
    var count = rows.length;
    document.getElementById('statCount').textContent = count;
    if (!count){
      document.getElementById('statAvg').textContent = '–';
      document.getElementById('statTopDish').textContent = '–';
      return;
    }
    var sum = 0, dishCounts = {};
    rows.forEach(function(r){
      sum += (r.rating || 0);
      (r.dishes || []).forEach(function(d){ dishCounts[d] = (dishCounts[d] || 0) + 1; });
    });
    document.getElementById('statAvg').textContent = (sum / count).toFixed(1);
    var topDish = Object.keys(dishCounts).sort(function(a,b){ return dishCounts[b]-dishCounts[a]; })[0];
    document.getElementById('statTopDish').textContent = topDish || '–';
  }

  function render(){
    var rows = getFiltered().slice().sort(function(a,b){
      return new Date(b.submittedAt) - new Date(a.submittedAt);
    });
    renderSummary(rows);

    if (!rows.length){
      listWrap.innerHTML =
        '<div class="empty-state">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M9 10h.01M15 10h.01M8 15c1.2 1 2.5 1.5 4 1.5s2.8-.5 4-1.5"/></svg>' +
        '<p>No ratings in this date range.</p></div>';
      return;
    }

    listWrap.innerHTML = '<div class="ratings-list">' + rows.map(function(r){
      return '<div class="rating-card">' +
        '<div class="rating-top">' +
          '<div class="rating-name">' + esc(r.name) + '</div>' +
          '<div class="rating-date">' + esc(fmtDate(r.submittedAt)) + '</div>' +
        '</div>' +
        '<div class="rating-stars">' + starRow(r.rating || 0) + '</div>' +
        '<div class="rating-dishes">' + (r.dishes || []).map(function(d){
          return '<span class="dish-tag">' + esc(d) + '</span>';
        }).join('') + '</div>' +
        (r.comments ? '<div class="rating-comments">"' + esc(r.comments) + '"</div>' : '') +
      '</div>';
    }).join('') + '</div>';
  }

  Array.prototype.forEach.call(presetRow.querySelectorAll('.preset-btn'), function(b){
    b.addEventListener('click', function(){ applyPreset(b.dataset.range); });
  });
  fromDate.addEventListener('change', function(){ setActivePreset(''); render(); });
  toDate.addEventListener('change', function(){ setActivePreset(''); render(); });
  clearFilter.addEventListener('click', function(){ applyPreset('all'); });

  fetch('ratings.json', { cache: 'no-store' })
    .then(function(resp){ return resp.ok ? resp.json() : []; })
    .then(function(data){
      allRatings = Array.isArray(data) ? data : [];
      render();
    })
    .catch(function(){
      listWrap.innerHTML = '<div class="empty-state"><p>Could not load ratings.json.</p></div>';
    });
})();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Navrang Admin — Categories</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A2A12">
<link rel="icon" href="../navrang_logo.png">
<link rel="stylesheet" href="admin-style.css">
<style>
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media (max-width:560px){ .form-grid{grid-template-columns:1fr;} }
  .form-actions{display:flex;gap:10px;align-items:center;margin-top:6px;}
  .cat-table td{vertical-align:middle;}
  .cat-icon-preview{width:28px;height:28px;color:var(--maroon);flex:0 0 auto;}
  .cat-icon-preview svg{width:100%;height:100%;}
  .cat-id{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-muted);white-space:nowrap;}
  .cat-input{width:100%;min-width:120px;border:1.5px solid var(--rule);border-radius:var(--radius-md);padding:8px 10px;font-size:13px;background:var(--bg-surface);outline:none;font-family:inherit;transition:all .15s ease;}
  .cat-input:focus{border-color:var(--maroon);box-shadow:0 0 0 3px rgba(14,77,38,.12);}
  .cat-img-cell{display:flex;align-items:center;gap:10px;}
  .cat-thumb{width:38px;height:38px;border-radius:8px;object-fit:cover;border:1px solid var(--rule);background:var(--bg-surface-soft);flex:0 0 38px;}
  .cat-thumb-empty{width:38px;height:38px;border-radius:8px;border:1.5px dashed var(--rule);display:flex;align-items:center;justify-content:center;color:var(--ink-muted);font-size:10px;background:var(--bg-surface-soft);flex:0 0 38px;}
  .cat-img-input{min-width:140px;}
  .cat-row-status{font-size:11.5px;font-weight:600;white-space:nowrap;}
  .cat-row-status.success{color:var(--leaf);}
  .cat-row-status.error{color:var(--nonveg);}
  .cat-save-btn{
    background:var(--emerald-gradient);color:#fff;border:none;border-radius:8px;
    padding:8px 16px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap;
    box-shadow:0 1px 3px rgba(14,77,38,.2);transition:all .15s ease;
  }
  .cat-save-btn:hover{filter:brightness(1.08);}
  .cat-save-btn:active{transform:scale(.96);}
  .cat-save-btn:disabled{opacity:.5;cursor:not-allowed;}
  .cat-hint{font-size:13px;color:var(--ink-muted);margin:0 0 16px;}
  .auto-te-hint{font-size:11.5px;color:var(--ink-muted);margin:4px 0 0;min-height:14px;}
</style>
</head>
<body>

<div class="admin-shell">
  <div class="admin-header-bar">
    <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <img src="../navrang_logo.png" alt="Navrang">
    <h1>Categories</h1>
  </div>
  <nav class="admin-topnav-bar" id="adminTopNav"></nav>
  <div class="admin-body">
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <aside class="admin-sidebar" id="adminSidebar">
      <nav class="admin-nav" id="adminNav"></nav>
    </aside>
    <main class="admin-main">
  <div class="admin-panel">
    <h2>New Category</h2>
    <div class="admin-card">
      <form id="createForm">
        <div class="form-grid">
          <div class="admin-field">
            <label for="cNewTitle">Title (English)</label>
            <input type="text" id="cNewTitle" required maxlength="60">
          </div>
          <div class="admin-field">
            <label for="cNewTitleTe">Title (Telugu)</label>
            <input type="text" id="cNewTitleTe" required maxlength="60">
            <p class="auto-te-hint" id="cNewTitleTeHint"></p>
          </div>
          <div class="admin-field">
            <label for="cNewShort">Short label (English, optional)</label>
            <input type="text" id="cNewShort" maxlength="30">
          </div>
          <div class="admin-field">
            <label for="cNewShortTe">Short label (Telugu, optional)</label>
            <input type="text" id="cNewShortTe" maxlength="30">
            <p class="auto-te-hint" id="cNewShortTeHint"></p>
          </div>
          <div class="admin-field" style="grid-column:1/-1;">
            <label for="cNewImage">Image URL / Path (optional, e.g. images/starters.jpg)</label>
            <div style="display:flex;gap:10px;align-items:center;">
              <input type="text" id="cNewImage" placeholder="images/category-image.jpg" style="flex:1;">
              <img id="cNewImagePreview" src="" alt="Preview" style="display:none;width:38px;height:38px;border-radius:6px;object-fit:cover;border:1px solid var(--rule);background:var(--paper-soft);">
            </div>
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="admin-btn" id="createBtn">Create Category</button>
        </div>
        <p class="admin-status" id="createStatus"></p>
      </form>
    </div>

    <h2>Edit Categories</h2>
    <p class="cat-hint">Category names shown on the order page and printed menus. Ids are permanent once created (dishes are filed under them), so a category can't be renamed or removed here — only its title/labels.</p>
    <div class="admin-table-wrap" id="listWrap">
      <div class="admin-loading">Loading categories…</div>
    </div>
  </div>
    </main>
  </div>
</div>

<script src="admin-shared.js"></script>
<script>
(function(){
  if (!AdminShared.requireAuthOrRedirect()) return;
  AdminShared.renderNav('categories');
  var esc = AdminShared.esc;
  var listWrap = document.getElementById('listWrap');

  function iconSvg(paths){
    return '<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">' + paths + '</svg>';
  }

  function renderList(categories){
    listWrap.innerHTML = '<table class="admin-table cat-table"><thead><tr><th></th><th>ID</th><th>Image</th><th>Title (EN)</th><th>Title (TE)</th><th>Short (EN)</th><th>Short (TE)</th><th></th><th></th></tr></thead><tbody>' +
      categories.map(function(c){
        return '<tr data-id="' + esc(c.id) + '">' +
          '<td><span class="cat-icon-preview">' + iconSvg(c.icon || '') + '</span></td>' +
          '<td><span class="cat-id">' + esc(c.id) + '</span></td>' +
          '<td>' +
            '<div class="cat-img-cell">' +
              '<img class="cat-thumb" src="' + esc(c.image || '') + '" alt="" style="' + (c.image ? '' : 'display:none;') + '" onerror="this.style.display=\'none\';if(this.nextElementSibling)this.nextElementSibling.style.display=\'flex\';">' +
              '<div class="cat-thumb-empty" style="' + (c.image ? 'display:none;' : '') + '">No img</div>' +
              '<input class="cat-input cat-img-input" data-field="image" placeholder="images/..." value="' + esc(c.image || '') + '">' +
            '</div>' +
          '</td>' +
          '<td><input class="cat-input" data-field="title" value="' + esc(c.title) + '"></td>' +
          '<td><input class="cat-input" data-field="titleTe" value="' + esc(c.titleTe) + '"></td>' +
          '<td><input class="cat-input" data-field="short" value="' + esc(c.short) + '"></td>' +
          '<td><input class="cat-input" data-field="shortTe" value="' + esc(c.shortTe) + '"></td>' +
          '<td><button type="button" class="cat-save-btn">Save</button></td>' +
          '<td><span class="cat-row-status"></span></td>' +
          '</tr>';
      }).join('') + '</tbody></table>';

    Array.prototype.forEach.call(listWrap.querySelectorAll('tbody tr'), function(row){
      var id = row.dataset.id;
      var btn = row.querySelector('.cat-save-btn');
      var status = row.querySelector('.cat-row-status');
      var imgInput = row.querySelector('.cat-img-input');
      var thumb = row.querySelector('.cat-thumb');
      var empty = row.querySelector('.cat-thumb-empty');

      if (imgInput && thumb && empty){
        imgInput.addEventListener('input', function(){
          var val = imgInput.value.trim();
          if (val){
            thumb.src = val;
            thumb.style.display = 'inline-block';
            empty.style.display = 'none';
          } else {
            thumb.src = '';
            thumb.style.display = 'none';
            empty.style.display = 'flex';
          }
        });
      }

      btn.addEventListener('click', function(){
        var payload = { id: id };
        Array.prototype.forEach.call(row.querySelectorAll('.cat-input'), function(input){
          payload[input.dataset.field] = input.value.trim();
        });
        if (!payload.title || !payload.titleTe){
          status.textContent = 'Title (EN/TE) required.';
          status.className = 'cat-row-status error';
          return;
        }
        btn.disabled = true;
        status.textContent = 'Saving…';
        status.className = 'cat-row-status';
        AdminShared.apiFetch('/api/categories', { method: 'POST', body: JSON.stringify(payload) })
          .then(function(resp){ return resp.json().then(function(data){ return { ok: resp.ok, data: data }; }); })
          .then(function(result){
            if (!result.ok) throw new Error(result.data.error || 'Save failed');
            status.textContent = 'Saved.';
            status.className = 'cat-row-status success';
          })
          .catch(function(err){
            status.textContent = err.message || 'Something went wrong.';
            status.className = 'cat-row-status error';
          })
          .finally(function(){ btn.disabled = false; });
      });
    });
  }

  /* ---------- Auto-populate Telugu title from existing category vocabulary ---------- */
  var teDict = {};
  function buildTeDictionary(categories){
    var counts = {};
    categories.forEach(function(c){
      [[c.title, c.titleTe], [c.short, c.shortTe]].forEach(function(pair){
        var en = (pair[0] || '').trim().split(/\s+/);
        var te = (pair[1] || '').trim().split(/\s+/);
        if (!en[0] || en.length !== te.length) return;
        en.forEach(function(w, i){
          var key = w.toLowerCase();
          counts[key] = counts[key] || {};
          counts[key][te[i]] = (counts[key][te[i]] || 0) + 1;
        });
      });
    });
    teDict = {};
    Object.keys(counts).forEach(function(key){
      teDict[key] = Object.keys(counts[key]).sort(function(a, b){ return counts[key][b] - counts[key][a]; })[0];
    });
  }
  function translateWords(textEn){
    var words = textEn.trim().split(/\s+/).filter(Boolean);
    if (!words.length) return null;
    var out = words.map(function(w){ return teDict[w.toLowerCase()]; });
    if (out.some(function(w){ return !w; })) return null;
    return out.join(' ');
  }

  /* Fallback for words not seen in any existing category: machine-translate via MyMemory's free API. */
  function fetchMachineTranslation(textEn){
    var url = 'https://api.mymemory.translated.net/get?q=' + encodeURIComponent(textEn) + '&langpair=en|te';
    return fetch(url).then(function(resp){ return resp.json(); }).then(function(data){
      var t = data && data.responseData && data.responseData.translatedText;
      return (t && !/^(NO QUERY|INVALID|PLEASE)/i.test(t)) ? t : null;
    }).catch(function(){ return null; });
  }

  function wireAutoTranslate(srcInput, teInput, hintEl){
    var lastAuto = '';
    var debounceTimer = null;
    var requestSeq = 0;

    function applyAuto(suggestion, hintText){
      if (!teInput.value.trim() || teInput.value === lastAuto){
        teInput.value = suggestion;
        lastAuto = suggestion;
        if (hintEl) hintEl.textContent = hintText;
      }
    }
    function clearAuto(){
      if (teInput.value === lastAuto){
        teInput.value = '';
        lastAuto = '';
        if (hintEl) hintEl.textContent = '';
      }
    }

    srcInput.addEventListener('input', function(){
      clearTimeout(debounceTimer);
      requestSeq++;
      var text = srcInput.value;
      var dictSuggestion = translateWords(text);
      if (dictSuggestion){
        applyAuto(dictSuggestion, 'Auto-filled from existing categories — check before saving.');
        return;
      }
      clearAuto();
      if (!text.trim()) return;
      var seq = requestSeq;
      debounceTimer = setTimeout(function(){
        fetchMachineTranslation(text.trim()).then(function(result){
          if (seq !== requestSeq || !result) return;
          applyAuto(result, 'Machine-translated — please verify before saving.');
        });
      }, 600);
    });
    if (hintEl) teInput.addEventListener('input', function(){ if (teInput.value !== lastAuto) hintEl.textContent = ''; });
  }
  wireAutoTranslate(document.getElementById('cNewTitle'), document.getElementById('cNewTitleTe'), document.getElementById('cNewTitleTeHint'));
  wireAutoTranslate(document.getElementById('cNewShort'), document.getElementById('cNewShortTe'), document.getElementById('cNewShortTeHint'));

  var newImgInput = document.getElementById('cNewImage');
  var newImgPrev = document.getElementById('cNewImagePreview');
  if (newImgInput && newImgPrev){
    newImgInput.addEventListener('input', function(){
      var val = newImgInput.value.trim();
      if (val){
        newImgPrev.src = val;
        newImgPrev.style.display = 'block';
      } else {
        newImgPrev.src = '';
        newImgPrev.style.display = 'none';
      }
    });
    newImgPrev.addEventListener('error', function(){
      newImgPrev.style.display = 'none';
    });
  }

  function loadCategories(){
    return AdminShared.apiFetch('/api/categories').then(function(resp){
      return resp.json().then(function(data){ return { ok: resp.ok, data: data }; });
    }).then(function(result){
      if (!result.ok) throw new Error(result.data.error || 'Failed to load categories');
      var categories = Array.isArray(result.data) ? result.data : (result.data.categories || []);
      buildTeDictionary(categories);
      renderList(categories);
    }).catch(function(err){
      listWrap.innerHTML = '<div class="admin-empty">' + esc(err.message || 'Failed to load categories.') + '</div>';
    });
  }

  var createForm = document.getElementById('createForm');
  var createBtn = document.getElementById('createBtn');
  var createStatus = document.getElementById('createStatus');
  createForm.addEventListener('submit', function(e){
    e.preventDefault();
    var payload = {
      action: 'create',
      title: document.getElementById('cNewTitle').value.trim(),
      titleTe: document.getElementById('cNewTitleTe').value.trim(),
      short: document.getElementById('cNewShort').value.trim(),
      shortTe: document.getElementById('cNewShortTe').value.trim(),
      image: document.getElementById('cNewImage').value.trim()
    };
    createBtn.disabled = true;
    createStatus.textContent = '';
    createStatus.className = 'admin-status';
    AdminShared.apiFetch('/api/categories', { method: 'POST', body: JSON.stringify(payload) })
      .then(function(resp){ return resp.json().then(function(data){ return { ok: resp.ok, data: data }; }); })
      .then(function(result){
        if (!result.ok) throw new Error(result.data.error || 'Create failed');
        createForm.reset();
        if (newImgPrev) newImgPrev.style.display = 'none';
        createStatus.textContent = 'Category "' + result.data.category.title + '" created.';
        createStatus.className = 'admin-status success';
        return loadCategories();
      })
      .catch(function(err){
        createStatus.textContent = err.message || 'Something went wrong.';
        createStatus.className = 'admin-status error';
      })
      .finally(function(){ createBtn.disabled = false; });
  });

  loadCategories();
})();
</script>
</body>
</html>

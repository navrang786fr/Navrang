<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Navrang Admin — Dish Rates</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A2A12">
<link rel="icon" href="../navrang_logo.png">
<link rel="stylesheet" href="admin-style.css">
<style>
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media (max-width:560px){ .form-grid{grid-template-columns:1fr;} }
  .admin-field-wide{grid-column:1 / -1;}
  .checkbox-row{display:flex;flex-wrap:wrap;gap:14px 22px;padding:4px 0;}
  .form-actions{display:flex;gap:10px;align-items:center;}

  .upload-zone{
    display:flex;align-items:center;justify-content:center;
    border:1.6px dashed var(--rule);border-radius:12px;
    background:var(--paper);cursor:pointer;position:relative;
    padding:20px 16px;transition:border-color .15s ease,background .15s ease;
  }
  .upload-zone:hover,.upload-zone.dragover{border-color:var(--maroon);background:rgba(122,18,32,.03);}
  .upload-input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;}
  .upload-zone-empty{display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;color:var(--maroon);}
  .upload-zone-empty svg{width:26px;height:26px;color:var(--turmeric);}
  .upload-zone-text{font-size:13px;font-weight:600;color:var(--ink);}
  .upload-zone-text strong{color:var(--maroon);}
  .upload-zone-sub{font-size:11px;color:var(--maroon);opacity:.65;}
  .upload-zone-filled{display:flex;align-items:center;gap:12px;width:100%;text-align:left;}
  .upload-preview-img{width:60px;height:60px;object-fit:cover;border-radius:10px;border:1px solid var(--rule);flex:0 0 auto;background:var(--paper-soft);}
  .upload-filled-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
  .upload-filename{font-size:13px;font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .upload-hint{font-size:11px;color:var(--maroon);opacity:.75;line-height:1.4;}
  .upload-remove-btn{
    flex:0 0 auto;width:28px;height:28px;border-radius:50%;border:none;
    background:var(--paper-soft);color:var(--nonveg);font-size:13px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:background .15s ease,color .15s ease;
  }
  .upload-remove-btn:hover{background:var(--nonveg);color:#fff;}
  .upload-zone.processing{pointer-events:none;opacity:.75;}
  .upload-spinner{
    width:16px;height:16px;border-radius:50%;flex:0 0 auto;
    border:2px solid var(--rule);border-top-color:var(--maroon);
    animation:upload-spin .7s linear infinite;
  }
  @keyframes upload-spin{to{transform:rotate(360deg);}}
  .search-row{display:flex;gap:8px;margin-bottom:12px;}
  .search-row input{flex:1;border:1.3px solid var(--rule);border-radius:9px;padding:9px 11px;font-size:13.5px;background:var(--paper);outline:none;}
  .search-row input:focus{border-color:var(--maroon);}
  .edit-link{color:var(--maroon);font-weight:700;text-decoration:underline;cursor:pointer;font-size:12.5px;background:none;border:none;padding:0;}
  .row-thumb{width:40px;height:40px;object-fit:cover;border-radius:8px;border:1px solid var(--rule);background:var(--paper-soft);display:block;cursor:pointer;transition:transform .12s ease;}
  .row-thumb:hover{transform:scale(1.08);}
  .img-lightbox{
    position:fixed;inset:0;z-index:90;background:rgba(10,15,10,.82);
    display:flex;align-items:center;justify-content:center;padding:24px;
    opacity:0;pointer-events:none;transition:opacity .2s ease;
  }
  .img-lightbox.show{opacity:1;pointer-events:auto;}
  .img-lightbox-card{position:relative;max-width:min(90vw,420px);width:100%;background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.5);padding:14px 14px 16px;}
  .img-lightbox-card img{display:block;width:100%;max-height:68vh;object-fit:contain;border-radius:10px;}
  .img-lightbox-caption{margin:10px 0 0;text-align:center;font-weight:700;color:var(--ink);}
  .img-lightbox-close{
    position:absolute;top:-14px;right:-14px;width:32px;height:32px;border-radius:50%;
    background:var(--maroon-deep);color:#fff;border:2px solid #fff;
    display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;
    box-shadow:0 4px 12px rgba(0,0,0,.3);
  }
</style>
</head>
<body>

<div class="admin-shell">
  <div class="admin-header-bar">
    <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <img src="../navrang_logo.png" alt="Navrang">
    <h1>Dish Rates</h1>
  </div>
  <div class="admin-body">
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <aside class="admin-sidebar" id="adminSidebar">
      <nav class="admin-nav" id="adminNav"></nav>
    </aside>
    <main class="admin-main">
  <div class="admin-panel">
    <h2 id="formHeading">Create New Dish</h2>
    <div class="admin-card">
      <form id="dishForm">
        <div class="form-grid">
          <div class="admin-field">
            <label for="fCategory">Category</label>
            <select id="fCategory" required></select>
          </div>
          <div class="admin-field">
            <label for="fName">Name (English)</label>
            <input type="text" id="fName" required maxlength="80">
          </div>
          <div class="admin-field">
            <label for="fNameTe">Name (Telugu)</label>
            <input type="text" id="fNameTe" required maxlength="80">
            <p id="teHint" style="font-size:11px;color:var(--maroon);opacity:.7;margin:5px 0 0;"></p>
          </div>
          <div class="admin-field">
            <label for="fPrice">Price (₹, blank = "Ask staff")</label>
            <input type="number" id="fPrice" min="0" step="1">
          </div>
          <div class="admin-field">
            <label for="fStatus">Status</label>
            <select id="fStatus">
              <option value="Active">Active</option>
              <option value="Inactive">Inactive</option>
            </select>
          </div>
          <div class="admin-field admin-field-wide">
            <div class="checkbox-row">
              <label class="admin-checkbox"><input type="checkbox" id="fVeg"> Vegetarian</label>
              <label class="admin-checkbox"><input type="checkbox" id="fNonVeg"> Non-Veg</label>
              <label class="admin-checkbox"><input type="checkbox" id="fTop"> Top Pick</label>
              <label class="admin-checkbox"><input type="checkbox" id="fWeekly"> Weekly Dish</label>
            </div>
          </div>
          <div class="admin-field admin-field-wide">
            <label for="fImage">Dish Photo (optional)</label>
            <label class="upload-zone" id="uploadZone" for="fImage">
              <input type="file" id="fImage" accept="image/*" class="upload-input">

              <div class="upload-zone-empty" id="uploadEmpty">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M12 4l-4 4M12 4l4 4"/><path d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
                <span class="upload-zone-text"><strong>Click to upload</strong> or drag and drop</span>
                <span class="upload-zone-sub">JPG or PNG, up to 8MB</span>
              </div>

              <div class="upload-zone-filled" id="uploadFilled" style="display:none;">
                <img id="imagePreview" class="upload-preview-img" alt="">
                <div class="upload-filled-info">
                  <span class="upload-filename" id="uploadFileName"></span>
                  <span class="upload-hint" id="imageHint"></span>
                </div>
                <button type="button" class="upload-remove-btn" id="removeImageBtn" aria-label="Remove photo" title="Remove photo">✕</button>
              </div>
            </label>
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="admin-btn" id="submitBtn">Create Dish</button>
          <button type="button" class="admin-btn admin-btn-secondary" id="cancelBtn" style="display:none;">Cancel Edit</button>
        </div>
        <p class="admin-status" id="formStatus"></p>
      </form>
    </div>

    <h2>All Dishes</h2>
    <div class="search-row">
      <input type="text" id="searchBox" placeholder="Filter by name…">
    </div>
    <div class="admin-table-wrap" id="listWrap">
      <div class="admin-loading">Loading dishes…</div>
    </div>
  </div>
    </main>
  </div>
</div>

<div class="img-lightbox" id="imgLightbox">
  <div class="img-lightbox-card">
    <button type="button" class="img-lightbox-close" id="imgLightboxClose" aria-label="Close">✕</button>
    <img id="imgLightboxImg" src="" alt="">
    <p class="img-lightbox-caption" id="imgLightboxCaption"></p>
  </div>
</div>

<script src="admin-shared.js"></script>
<script>
(function(){
  if (!AdminShared.requireAuthOrRedirect()) return;
  AdminShared.renderNav('dishes');
  var esc = AdminShared.esc;

  var menu = {}, categories = [];
  var editingId = null;

  var form = document.getElementById('dishForm');
  var fCategory = document.getElementById('fCategory');
  var fName = document.getElementById('fName');
  var fNameTe = document.getElementById('fNameTe');
  var fPrice = document.getElementById('fPrice');
  var fStatus = document.getElementById('fStatus');
  var fVeg = document.getElementById('fVeg');
  var fNonVeg = document.getElementById('fNonVeg');
  var fTop = document.getElementById('fTop');
  var fWeekly = document.getElementById('fWeekly');
  var fImage = document.getElementById('fImage');
  var imageHint = document.getElementById('imageHint');
  var imagePreview = document.getElementById('imagePreview');
  var uploadZone = document.getElementById('uploadZone');
  var uploadEmpty = document.getElementById('uploadEmpty');
  var uploadFilled = document.getElementById('uploadFilled');
  var uploadFileName = document.getElementById('uploadFileName');
  var removeImageBtn = document.getElementById('removeImageBtn');
  var submitBtn = document.getElementById('submitBtn');
  var cancelBtn = document.getElementById('cancelBtn');
  var formStatus = document.getElementById('formStatus');
  var formHeading = document.getElementById('formHeading');
  var listWrap = document.getElementById('listWrap');
  var searchBox = document.getElementById('searchBox');
  var teHint = document.getElementById('teHint');

  var imgLightbox = document.getElementById('imgLightbox');
  var imgLightboxImg = document.getElementById('imgLightboxImg');
  var imgLightboxCaption = document.getElementById('imgLightboxCaption');
  function openImageLightbox(src, caption){
    imgLightboxImg.src = src;
    imgLightboxCaption.textContent = caption || '';
    imgLightbox.classList.add('show');
  }
  function closeImageLightbox(){ imgLightbox.classList.remove('show'); }
  imgLightbox.addEventListener('click', closeImageLightbox);
  document.getElementById('imgLightboxClose').addEventListener('click', closeImageLightbox);
  document.querySelector('.img-lightbox-card').addEventListener('click', function(e){ e.stopPropagation(); });

  function allDishesFlat(){
    var out = [];
    Object.keys(menu).forEach(function(catId){
      menu[catId].forEach(function(d){ out.push(Object.assign({ categoryId: catId }, d)); });
    });
    return out;
  }

  /* ---------- Auto-populate Telugu name from existing dish vocabulary ---------- */
  var teDict = {};
  var lastAutoTe = '';
  function buildTeDictionary(){
    var counts = {};
    allDishesFlat().forEach(function(d){
      var en = (d.name || '').replace(/\(.*?\)/g, '').trim().split(/\s+/);
      var te = (d.nameTe || '').replace(/\(.*?\)/g, '').trim().split(/\s+/);
      if (!en[0] || en.length !== te.length) return;
      en.forEach(function(w, i){
        var key = w.toLowerCase();
        counts[key] = counts[key] || {};
        counts[key][te[i]] = (counts[key][te[i]] || 0) + 1;
      });
    });
    teDict = {};
    Object.keys(counts).forEach(function(key){
      teDict[key] = Object.keys(counts[key]).sort(function(a, b){ return counts[key][b] - counts[key][a]; })[0];
    });
  }
  function translateName(nameEn){
    var words = nameEn.trim().split(/\s+/).filter(Boolean);
    if (!words.length) return null;
    var out = words.map(function(w){ return teDict[w.toLowerCase()]; });
    if (out.some(function(w){ return !w; })) return null;
    return out.join(' ');
  }
  fName.addEventListener('input', function(){
    var suggestion = translateName(fName.value);
    if (suggestion){
      if (!fNameTe.value.trim() || fNameTe.value === lastAutoTe){
        fNameTe.value = suggestion;
        lastAutoTe = suggestion;
        teHint.textContent = 'Auto-filled from existing dish names — check before saving.';
      }
    } else if (fNameTe.value === lastAutoTe){
      fNameTe.value = '';
      lastAutoTe = '';
      teHint.textContent = fName.value.trim() ? 'No match in existing dish names — please enter Telugu manually.' : '';
    }
  });
  fNameTe.addEventListener('input', function(){
    if (fNameTe.value !== lastAutoTe) teHint.textContent = '';
  });

  fVeg.addEventListener('change', function(){ if (fVeg.checked) fNonVeg.checked = false; });
  fNonVeg.addEventListener('change', function(){ if (fNonVeg.checked) fVeg.checked = false; });

  function slugify(name){
    return String(name).toLowerCase().trim()
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/^-+|-+$/g, '');
  }

  /** Draws `file` into a square canvas of `size`x`size` (center-cropped, like object-fit:cover) and returns a JPEG data URL. */
  function resizeImageToDataUrl(file, size, quality){
    return new Promise(function(resolve, reject){
      var img = new Image();
      var url = URL.createObjectURL(file);
      img.onload = function(){
        URL.revokeObjectURL(url);
        var srcSize = Math.min(img.naturalWidth, img.naturalHeight);
        var sx = (img.naturalWidth - srcSize) / 2;
        var sy = (img.naturalHeight - srcSize) / 2;
        var canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, sx, sy, srcSize, srcSize, 0, 0, size, size);
        resolve(canvas.toDataURL('image/jpeg', quality || 0.85));
      };
      img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error('Could not read image file')); };
      img.src = url;
    });
  }

  function fileToDataUrl(file){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(){ resolve(reader.result); };
      reader.onerror = function(){ reject(new Error('Could not read file')); };
      reader.readAsDataURL(file);
    });
  }

  /** Downscales (preserving aspect ratio, no crop) so the longest side is at most maxDim. Used only as a size safety-net for very large originals. */
  function downscaleImageToDataUrl(file, maxDim, quality){
    return new Promise(function(resolve, reject){
      var img = new Image();
      var url = URL.createObjectURL(file);
      img.onload = function(){
        URL.revokeObjectURL(url);
        var scale = Math.min(1, maxDim / Math.max(img.naturalWidth, img.naturalHeight));
        var w = Math.round(img.naturalWidth * scale);
        var h = Math.round(img.naturalHeight * scale);
        var canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality || 0.85));
      };
      img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error('Could not read image file')); };
      img.src = url;
    });
  }

  function buildImagesPayload(file){
    if (file.size > 8 * 1024 * 1024) return Promise.reject(new Error('Image is too large (max 8MB).'));
    var ext = (file.type.split('/')[1] || 'jpg').replace('jpeg', 'jpg');
    var originalPromise = file.size > 3 * 1024 * 1024 ? downscaleImageToDataUrl(file, 1600, 0.85) : fileToDataUrl(file);
    return Promise.all([
      resizeImageToDataUrl(file, 500, 0.85),
      resizeImageToDataUrl(file, 100, 0.85),
      originalPromise
    ]).then(function(results){
      return { originalExt: ext, photoDataUrl: results[0], thumbDataUrl: results[1], originalDataUrl: results[2] };
    });
  }

  function showEmptyUpload(){
    uploadEmpty.style.display = '';
    uploadFilled.style.display = 'none';
    imageHint.textContent = '';
    uploadZone.classList.remove('processing');
  }
  function showFilledUpload(previewSrc, fileName, hintText){
    imagePreview.src = previewSrc;
    uploadFileName.textContent = fileName;
    imageHint.textContent = hintText;
    uploadEmpty.style.display = 'none';
    uploadFilled.style.display = '';
    uploadZone.classList.remove('processing');
  }
  function setUploadProcessing(isProcessing, label){
    uploadZone.classList.toggle('processing', isProcessing);
    if (isProcessing){
      uploadFileName.innerHTML = '<span class="upload-spinner"></span> ' + esc(label || 'Processing…');
      imageHint.textContent = '';
    }
  }
  function handleSelectedFile(file){
    if (!file) return;
    var slug = slugify(fName.value) || 'dish';
    resizeImageToDataUrl(file, 100, 0.85).then(function(dataUrl){
      showFilledUpload(dataUrl, file.name, 'Will store as images/menu/' + slug + '-100.jpg / -500.jpg (+ original)');
    }).catch(function(){});
  }

  fImage.addEventListener('change', function(){
    handleSelectedFile(fImage.files[0]);
  });

  uploadZone.addEventListener('dragover', function(e){
    e.preventDefault();
    uploadZone.classList.add('dragover');
  });
  uploadZone.addEventListener('dragleave', function(){
    uploadZone.classList.remove('dragover');
  });
  uploadZone.addEventListener('drop', function(e){
    e.preventDefault();
    uploadZone.classList.remove('dragover');
    var file = e.dataTransfer.files && e.dataTransfer.files[0];
    if (!file) return;
    fImage.files = e.dataTransfer.files;
    handleSelectedFile(file);
  });

  removeImageBtn.addEventListener('click', function(e){
    e.preventDefault();
    e.stopPropagation();
    fImage.value = '';
    showEmptyUpload();
  });

  function resetForm(){
    editingId = null;
    form.reset();
    fImage.value = '';
    lastAutoTe = '';
    teHint.textContent = '';
    showEmptyUpload();
    fCategory.disabled = false;
    formHeading.textContent = 'Create New Dish';
    submitBtn.textContent = 'Create Dish';
    cancelBtn.style.display = 'none';
    formStatus.textContent = '';
    formStatus.className = 'admin-status';
  }

  function startEdit(dish){
    editingId = dish.id;
    fCategory.value = dish.categoryId;
    fCategory.disabled = true;
    fName.value = dish.name;
    fNameTe.value = dish.nameTe;
    fPrice.value = dish.price === null || dish.price === undefined ? '' : dish.price;
    fStatus.value = dish.status || 'Active';
    fVeg.checked = !!dish.veg;
    fNonVeg.checked = !dish.veg;
    fTop.checked = !!dish.top;
    fWeekly.checked = !!dish.weeklyDishInd;
    lastAutoTe = '';
    teHint.textContent = '';
    fImage.value = '';
    if (dish.thumb) {
      showFilledUpload('../' + dish.thumb, dish.name, 'Current photo — choose a new file to replace it');
    } else {
      showEmptyUpload();
    }
    formHeading.textContent = 'Edit Dish #' + dish.id;
    submitBtn.textContent = 'Save Changes';
    cancelBtn.style.display = '';
    formStatus.textContent = '';
    formStatus.className = 'admin-status';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  cancelBtn.addEventListener('click', resetForm);

  function renderList(){
    var q = searchBox.value.trim().toLowerCase();
    var rows = allDishesFlat().filter(function(d){
      return !q || d.name.toLowerCase().indexOf(q) !== -1 || d.nameTe.indexOf(q) !== -1;
    }).sort(function(a,b){ return a.id - b.id; });

    if (!rows.length){ listWrap.innerHTML = '<div class="admin-empty">No dishes match.</div>'; return; }

    listWrap.innerHTML = '<table class="admin-table"><thead><tr><th></th><th>ID</th><th>Name</th><th>Category</th><th>Price</th><th>Veg</th><th>Status</th><th></th></tr></thead><tbody>' +
      rows.map(function(d){
        var cat = categories.find(function(c){ return c.id === d.categoryId; });
        var badge = d.status === 'Active' ? 'active' : 'inactive';
        var thumbSrc = '../' + (d.thumb || 'images/menu/no-dish-image-100.jpg');
        var photoSrc = '../' + (d.photo || d.thumb || 'images/menu/no-dish-image-500.jpg');
        return '<tr>' +
          '<td><img class="row-thumb" src="' + esc(thumbSrc) + '" data-photo="' + esc(photoSrc) + '" data-name="' + esc(d.name) + '" alt="" loading="lazy"></td>' +
          '<td>' + d.id + '</td>' +
          '<td>' + esc(d.name) + '<br><span style="opacity:.6;">' + esc(d.nameTe) + '</span></td>' +
          '<td>' + esc(cat ? cat.title : d.categoryId) + '</td>' +
          '<td>' + (d.price === null || d.price === undefined ? '<span style="opacity:.5;">Ask staff</span>' : '₹' + d.price) + '</td>' +
          '<td>' + (d.veg ? 'Veg' : 'Non-Veg') + '</td>' +
          '<td><span class="admin-badge ' + badge + '">' + esc(d.status || 'Active') + '</span></td>' +
          '<td><button type="button" class="edit-link" data-id="' + d.id + '">Edit</button></td>' +
          '</tr>';
      }).join('') + '</tbody></table>';

    Array.prototype.forEach.call(listWrap.querySelectorAll('.row-thumb'), function(img){
      img.addEventListener('click', function(){
        openImageLightbox(img.dataset.photo, img.dataset.name);
      });
    });

    Array.prototype.forEach.call(listWrap.querySelectorAll('.edit-link'), function(btn){
      btn.addEventListener('click', function(){
        var id = parseInt(btn.dataset.id, 10);
        var dish = allDishesFlat().find(function(d){ return d.id === id; });
        if (dish) startEdit(dish);
      });
    });
  }

  searchBox.addEventListener('input', renderList);

  form.addEventListener('submit', function(e){
    e.preventDefault();
    var priceVal = fPrice.value.trim();
    var dish = {
      name: fName.value.trim(),
      nameTe: fNameTe.value.trim(),
      price: priceVal === '' ? null : Number(priceVal),
      veg: fVeg.checked,
      status: fStatus.value,
      top: fTop.checked,
      weeklyDishInd: fWeekly.checked
    };

    submitBtn.disabled = true;
    var originalBtnText = submitBtn.textContent;
    formStatus.textContent = '';
    formStatus.className = 'admin-status';

    var wasEdit = !!editingId;
    var file = fImage.files[0];
    if (file){
      setUploadProcessing(true, 'Resizing image…');
    } else {
      submitBtn.textContent = 'Saving…';
    }
    var imagesPromise = file ? buildImagesPayload(file) : Promise.resolve(null);

    imagesPromise.then(function(images){
      if (file) setUploadProcessing(true, 'Uploading photo…');
      submitBtn.textContent = 'Saving…';
      var payload = editingId
        ? { action: 'update', id: editingId, dish: dish }
        : { action: 'create', categoryId: fCategory.value, dish: dish };
      if (images) payload.images = images;
      return AdminShared.apiFetch('/api/dishes', { method: 'POST', body: JSON.stringify(payload) });
    })
      .then(function(resp){ return resp.json().then(function(data){ return { ok: resp.ok, data: data }; }); })
      .then(function(result){
        if (!result.ok) throw new Error(result.data.error || 'Save failed');
        return loadMenu();
      })
      .then(function(){
        resetForm();
        formStatus.textContent = wasEdit ? 'Saved.' : 'Dish created.';
        formStatus.className = 'admin-status success';
      })
      .catch(function(err){
        if (file) setUploadProcessing(false);
        formStatus.textContent = err.message || 'Something went wrong.';
        formStatus.className = 'admin-status error';
      })
      .finally(function(){ submitBtn.disabled = false; submitBtn.textContent = originalBtnText; });
  });

  function loadMenu(){
    return AdminShared.apiFetch('/api/dishes').then(function(resp){
      return resp.json().then(function(data){ return { ok: resp.ok, data: data }; });
    }).then(function(result){
      if (!result.ok) throw new Error(result.data.error || 'Failed to load dishes');
      menu = result.data.menu;
      categories = result.data.categories;
      fCategory.innerHTML = categories.map(function(c){ return '<option value="' + esc(c.id) + '">' + esc(c.title) + '</option>'; }).join('');
      buildTeDictionary();
      renderList();
    }).catch(function(err){
      listWrap.innerHTML = '<div class="admin-empty">' + esc(err.message || 'Could not load dishes.') + '</div>';
    });
  }

  loadMenu();
})();
</script>

</body>
</html>
